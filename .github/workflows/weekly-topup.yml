name: Weekly Top-up

# Friday-evening top-up of Rahaf's Jackson Priority 1 queue for the coming
# Monday (see src/weekly_topup.py; moved from Sunday after the 2026-11-08 run): picks the next records in doors-per-deal
# order, assigns them to Rahaf, tags them "Batch YYYY-MM-DD" (the Monday) plus
# one SMS Line A-K tag each (even round-robin), sets each owner's primary phone
# to the best Dial First/Second mobile, tags records with no usable phone
# "Mail Only", and points presets 01/02 at the new Batch tag. It never sets a
# status: am-start does that Monday 9:50 AM Central.
#
# DRY RUN by default: nothing is written until the repo variable TOPUP_LIVE is
# set to "true" (Settings -> Secrets and variables -> Actions -> Variables).
#
# Triggered by the Cloudflare Worker in dispatcher/ (siftstack-dispatcher)
# Fridays 6:00 PM Central with gate=true, which limits it to 18:00-20:00
# Central. No GitHub `schedule:` cron, since GitHub ran crons hours late.
#
# No once-per-day guard step: src/workflow_run_guard.py is built for
# pm-text-sender.yml only. A second run is still safe, because `apply` refuses
# when that Monday's Batch tag already exists (unless --force), and the
# concurrency group makes overlapping starts queue instead of running together.
#
# After the top-up, `validate` re-reads every record carrying that Monday's
# Batch tag and writes topup_ready_<Monday>.json into this run's artifact;
# am-start (pm-text-sender.yml) downloads the newest successful run's marker
# and launches only what it lists. A failed validation does not fail the run,
# so its not-ok marker is still the newest one and Monday launches nothing.
#
# Before the top-up, src/p1_enrich.py scores unscored phones (Trestle) and skip
# traces phoneless person owners (Tracerfy) on records SiftMap auto-added to the
# rung lists, so they can make this week's batch. Paid + writes only when the
# repo variable P1_ENRICH_LIVE is "true"; continue-on-error, so it never blocks
# the top-up.
#
# After validation, src/obituary_dp.py deep prospects new Jackson obituary
# records (Claude screen -> SmartSkip heirs -> Trestle) and writes heir phones +
# a message-board note tagged "DP Review" for Kaycie. Plan-only (free, no writes)
# unless the repo variable OBIT_DP_LIVE is "true"; continue-on-error, last, so it
# never delays or blocks the top-up.
#
# On a Friday it first runs the drip check (src/drip_exit_guard.py --friday):
# classifies every P1 morning-text drip (completed / delayed / weekend-bound /
# later-weekday / failed) and posts the report. It removes weekend-bound drips
# only when the repo variable FRIDAY_DRIP_STOP_LIVE is "true"; otherwise it is
# report-only. continue-on-error, so it never blocks the top-up.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Which job to run
        type: choice
        options: [weekly-topup]
        default: weekly-topup
      gate:
        description: Apply the job's Central time window (the Cloudflare dispatcher sets this; leave off for a manual run)
        type: boolean
        default: false

jobs:
  weekly-topup:
    runs-on: ubuntu-latest
    # 240, not 180: the 2026-11-13 run took 130 min (enrich 15 + apply 92 + validate 9) before the
    # obituary steps, and the 0.7 s API floor (a1184f8) can stretch apply further.
    timeout-minutes: 240
    concurrency:
      group: weekly-topup
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests anthropic python-dotenv
      - name: Friday drip check (removes weekend-bound drips only if FRIDAY_DRIP_STOP_LIVE is "true")
        continue-on-error: true
        timeout-minutes: 10
        env:
          REISIFT_API_KEY: ${{ secrets.REISIFT_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          LIVE: ${{ vars.FRIDAY_DRIP_STOP_LIVE }}
        run: |
          if [ "$(TZ=America/Chicago date +%a)" != "Fri" ]; then
            echo "Not Friday in Central; skipping drip check"; exit 0
          fi
          if [ "${{ inputs.gate }}" = "true" ] && [ "$(python -c "import sys; sys.path.insert(0, 'src'); from pm_text_sender import _in_window; print(_in_window('18:00-20:00'))")" != "True" ]; then
            echo "Outside 18:00-20:00 Central; skipping drip check"; exit 0
          fi
          ARGS="--friday --slack"
          if [ "$LIVE" = "true" ]; then ARGS="$ARGS --live"; fi
          echo "python src/drip_exit_guard.py $ARGS"
          python src/drip_exit_guard.py $ARGS
      - name: Enrich auto-added P1 records (dry run unless P1_ENRICH_LIVE is "true")
        continue-on-error: true
        # 25, not 15: enrich hit its 15-min cap on 2026-11-13 (records past the cap wait a week).
        timeout-minutes: 25
        env:
          REISIFT_API_KEY: ${{ secrets.REISIFT_API_KEY }}
          TRESTLE_API_KEY: ${{ secrets.TRESTLE_API_KEY }}
          TRACERFY_API_KEY: ${{ secrets.TRACERFY_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          LIVE: ${{ vars.P1_ENRICH_LIVE }}
        run: |
          if [ "${{ inputs.gate }}" = "true" ] && [ "$(python -c "import sys; sys.path.insert(0, 'src'); from pm_text_sender import _in_window; print(_in_window('18:00-20:00'))")" != "True" ]; then
            echo "Outside 18:00-20:00 Central; skipping enrich"; exit 0
          fi
          ARGS="--slack"
          if [ "$LIVE" = "true" ]; then ARGS="$ARGS --live"; fi
          echo "python src/p1_enrich.py $ARGS"
          python src/p1_enrich.py $ARGS
      - name: Weekly top-up (dry run unless TOPUP_LIVE is "true")
        env:
          REISIFT_API_KEY: ${{ secrets.REISIFT_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          LIVE: ${{ vars.TOPUP_LIVE }}
        run: |
          ARGS="apply --slack"
          if [ "$LIVE" = "true" ]; then ARGS="$ARGS --live"; fi
          if [ "${{ inputs.gate }}" = "true" ]; then ARGS="$ARGS --only-between 18:00-20:00"; fi
          echo "python src/weekly_topup.py $ARGS"
          python src/weekly_topup.py $ARGS
      - name: Validate Monday's batch and write the readiness marker
        env:
          REISIFT_API_KEY: ${{ secrets.REISIFT_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          ARGS="validate --slack"
          # Validate only reads, so its window runs to 23:59, not 20:00: it starts after apply
          # (92 min on 11-13), i.e. near 20:00, and a skipped validate writes no marker, so
          # Monday's am-start would launch nothing while this run still looked green.
          if [ "${{ inputs.gate }}" = "true" ]; then ARGS="$ARGS --only-between 18:00-23:59"; fi
          python src/weekly_topup.py $ARGS || echo "::warning::Monday's batch did not validate; am-start will launch nothing"
      - name: Alert if no readiness marker was written
        if: ${{ !cancelled() }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if ls output/pm_texts/topup_ready_*.json >/dev/null 2>&1; then echo "readiness marker written"; exit 0; fi
          echo "::warning::no readiness marker written"
          [ -n "$SLACK_WEBHOOK_URL" ] || exit 0
          MSG=":warning: Weekly top-up wrote NO readiness marker for Monday, so am-start will launch nothing unless the top-up/validate is re-run (mode weekly-topup, gate off): $RUN_URL"
          curl -s -X POST -H 'Content-Type: application/json' -d "{\"text\": \"$MSG\"}" "$SLACK_WEBHOOK_URL" || true
      - name: Obit age tags (plan only unless OBIT_AGE_LIVE is "true")
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 15
        env:
          REISIFT_API_KEY: ${{ secrets.REISIFT_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          LIVE: ${{ vars.OBIT_AGE_LIVE }}
        run: |
          ARGS="--slack"
          if [ "$LIVE" = "true" ]; then ARGS="$ARGS --live"; fi
          echo "python src/obit_age_tags.py $ARGS"
          python src/obit_age_tags.py $ARGS
      - name: Obituary deep prospecting (plan only unless OBIT_DP_LIVE is "true")
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 30
        env:
          REISIFT_API_KEY: ${{ secrets.REISIFT_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMARTSKIP_EMAIL: ${{ secrets.SMARTSKIP_EMAIL }}
          SMARTSKIP_PASSWORD: ${{ secrets.SMARTSKIP_PASSWORD }}
          TRESTLE_API_KEY: ${{ secrets.TRESTLE_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          LIVE: ${{ vars.OBIT_DP_LIVE }}
        run: |
          # 23:59, not 20:00: this step runs last, after validate, which itself can start near 20:00.
          if [ "${{ inputs.gate }}" = "true" ] && [ "$(python -c "import sys; sys.path.insert(0, 'src'); from pm_text_sender import _in_window; print(_in_window('18:00-23:59'))")" != "True" ]; then
            echo "Outside 18:00-23:59 Central; skipping obituary DP"; exit 0
          fi
          ARGS="--slack"
          if [ "$LIVE" = "true" ]; then ARGS="$ARGS --live"; fi
          echo "python src/obituary_dp.py $ARGS"
          python src/obituary_dp.py $ARGS
      - name: Alert if the top-up was cancelled or timed out
        if: cancelled()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$SLACK_WEBHOOK_URL" ] || exit 0
          MSG=":x: Weekly top-up was cancelled or timed out before it finished. Monday's batch may be partly written and may have no readiness marker: $RUN_URL"
          curl -s -X POST -H 'Content-Type: application/json' -d "{\"text\": \"$MSG\"}" "$SLACK_WEBHOOK_URL" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-topup-${{ github.run_id }}
          path: |
            output/pm_texts/topup_plan_*
            output/pm_texts/topup_ready_*
            output/pm_texts/friday_drips_*
            output/account_backups/topup_write_*
            output/pm_texts/p1_enrich_plan_*
            output/account_backups/p1_enrich_write_*
            output/pm_texts/obit_dp_*
            output/account_backups/obit_dp_write_*
            output/pm_texts/obit_age_tags_plan_*
            output/account_backups/obit_age_tags_*
          if-no-files-found: ignore
