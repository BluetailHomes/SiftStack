name: Weekly Top-up

# Sunday-evening top-up of Rahaf's Jackson Priority 1 queue for the coming
# Monday (see src/weekly_topup.py): picks the next records in doors-per-deal
# order, assigns them to Rahaf, tags them "Batch YYYY-MM-DD" (the Monday) plus
# one SMS Line A-E tag each (even round-robin), sets each owner's primary phone
# to the best Dial First/Second mobile, tags records with no usable phone
# "Mail Only", and points presets 01/02 at the new Batch tag. It never sets a
# status: am-start does that Monday 9:50 AM Central.
#
# DRY RUN by default: nothing is written until the repo variable TOPUP_LIVE is
# set to "true" (Settings -> Secrets and variables -> Actions -> Variables).
#
# Triggered by the Cloudflare Worker in dispatcher/ (siftstack-dispatcher)
# Sundays 6:00 PM Central with gate=true, which limits it to 18:00-20:00
# Central. No GitHub `schedule:` cron, since GitHub ran crons hours late.
#
# No once-per-day guard step: src/workflow_run_guard.py is built for
# pm-text-sender.yml only. A second run is still safe, because `apply` refuses
# when that Monday's Batch tag already exists (unless --force), and the
# concurrency group makes overlapping starts queue instead of running together.
#
# After the top-up, `validate` re-reads every record carrying that Monday's
# Batch tag and writes topup_ready_<Monday>.json into this run's artifact;
# am-start (pm-text-sender.yml) downloads the newest successful run's marker
# and launches only what it lists. A failed validation does not fail the run,
# so its not-ok marker is still the newest one and Monday launches nothing.
#
# Before the top-up, src/p1_enrich.py scores unscored phones (Trestle) and skip
# traces phoneless person owners (Tracerfy) on records SiftMap auto-added to the
# rung lists, so they can make this week's batch. Paid + writes only when the
# repo variable P1_ENRICH_LIVE is "true"; continue-on-error, so it never blocks
# the top-up.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Which job to run
        type: choice
        options: [weekly-topup]
        default: weekly-topup
      gate:
        description: Apply the job's Central time window (the Cloudflare dispatcher sets this; leave off for a manual run)
        type: boolean
        default: false

jobs:
  weekly-topup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: weekly-topup
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enrich auto-added P1 records (dry run unless P1_ENRICH_LIVE is "true")
        continue-on-error: true
        timeout-minutes: 15
        env:
          REISIFT_API_KEY: ${{ secrets.REISIFT_API_KEY }}
          TRESTLE_API_KEY: ${{ secrets.TRESTLE_API_KEY }}
          TRACERFY_API_KEY: ${{ secrets.TRACERFY_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          LIVE: ${{ vars.P1_ENRICH_LIVE }}
        run: |
          if [ "${{ inputs.gate }}" = "true" ] && [ "$(python -c "import sys; sys.path.insert(0, 'src'); from pm_text_sender import _in_window; print(_in_window('18:00-20:00'))")" != "True" ]; then
            echo "Outside 18:00-20:00 Central; skipping enrich"; exit 0
          fi
          ARGS="--slack"
          if [ "$LIVE" = "true" ]; then ARGS="$ARGS --live"; fi
          echo "python src/p1_enrich.py $ARGS"
          python src/p1_enrich.py $ARGS
      - name: Weekly top-up (dry run unless TOPUP_LIVE is "true")
        env:
          REISIFT_API_KEY: ${{ secrets.REISIFT_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          LIVE: ${{ vars.TOPUP_LIVE }}
        run: |
          ARGS="apply --slack"
          if [ "$LIVE" = "true" ]; then ARGS="$ARGS --live"; fi
          if [ "${{ inputs.gate }}" = "true" ]; then ARGS="$ARGS --only-between 18:00-20:00"; fi
          echo "python src/weekly_topup.py $ARGS"
          python src/weekly_topup.py $ARGS
      - name: Validate Monday's batch and write the readiness marker
        env:
          REISIFT_API_KEY: ${{ secrets.REISIFT_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          ARGS="validate --slack"
          if [ "${{ inputs.gate }}" = "true" ]; then ARGS="$ARGS --only-between 18:00-20:00"; fi
          python src/weekly_topup.py $ARGS || echo "::warning::Monday's batch did not validate; am-start will launch nothing"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-topup-${{ github.run_id }}
          path: |
            output/pm_texts/topup_plan_*
            output/pm_texts/topup_ready_*
            output/account_backups/topup_write_*
            output/pm_texts/p1_enrich_plan_*
            output/account_backups/p1_enrich_write_*
          if-no-files-found: ignore
