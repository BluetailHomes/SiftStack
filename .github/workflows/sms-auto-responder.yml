name: SMS auto-responder (draft mode)

# Watches DataSift for inbound texts on the Jackson P1 drip, classifies each one against
# docs/sms_reply_rules.md, and writes a suggested reply + proposed changes to the record's
# message board (and Slack). Draft mode sends NOTHING to sellers. See src/sms_auto_responder.py.
#
# TRIGGER (changed 2026-10-21): started every 5 minutes, 7:00 AM to 10:55 PM Central, by the
# Cloudflare Worker in dispatcher/ via workflow_dispatch. It has NO GitHub `schedule:` cron on
# purpose: GitHub ran the old */5 cron only 3 times in 9 hours on 2026-10-20 (a 3-hour cadence
# with a 20-minute lookback silently skipped most replies), and a second trigger could run
# concurrently with the dispatcher's and draft the same reply twice. The default lookback is
# 180 minutes so one missed poll never loses a reply; message-board markers keep it idempotent.

on:
  workflow_dispatch:
    inputs:
      since_minutes:
        description: "Lookback window in minutes"
        default: "180"
      dry_run:
        description: "true = classify only, write nothing"
        default: "false"

concurrency:
  group: sms-auto-responder
  cancel-in-progress: false

jobs:
  respond:
    runs-on: ubuntu-latest
    # 12, not 10 (2026-11-17): the guard (last step) has its own 7-minute cap, so a slow guard is
    # cut off on its own instead of taking the whole job, and the watches/responder run first.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests anthropic python-dotenv
      # Watch state (2026-11-17): call-watch, line-watch and the guard keep small JSON files in
      # output/watch_state/ between runs, carried run to run by the Actions cache (unique key per
      # run, restored from the newest). A cache miss is safe: each falls back to its old
      # stateless behaviour for that one run.
      - name: Restore watch state
        uses: actions/cache/restore@v4
        with:
          path: output/watch_state
          key: watch-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: watch-state-
      # Inbound call watch (added 2026-10-26): posts every inbound call/voicemail on our lines to
      # Google Chat (Seller Texts) + Slack. With --state it looks back to the previous run (minus
      # 2 min, at most 12 h) and skips calls already posted, so a skipped or late dispatcher run
      # no longer loses calls and the overlap no longer double-posts. Runs first: cheapest and
      # most time-sensitive.
      - name: Inbound call watch
        if: always()
        timeout-minutes: 3
        env:
          REISIFT_API_KEY: ${{ secrets.REISIFT_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
        run: |
          ARGS="--state output/watch_state/call_watch.json"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="--no-post"; fi
          python src/pm_text_sender.py call-watch $ARGS
      # Line volume watch (added 2026-10-23): alerts Google Chat + Slack when any of our SMS lines
      # passes 20 texts today (then every 5 more), to keep lines under carrier spam flags. Counts
      # from DataSift's owner.sms.sent log, so drip, manual and API texts all count. With --state
      # it remembers the level already alerted per line today, so a late run still alerts (once,
      # at the current level) instead of missing a crossing outside the 5-minute window.
      - name: Line volume watch
        if: always()
        timeout-minutes: 3
        env:
          REISIFT_API_KEY: ${{ secrets.REISIFT_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
        run: |
          ARGS="--state output/watch_state/line_watch.json"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="--no-post"; fi
          python src/pm_text_sender.py line-watch $ARGS
      - name: Run responder
        if: always()
        timeout-minutes: 5
        env:
          REISIFT_API_KEY: ${{ secrets.REISIFT_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          SMS_RESPONDER_MODEL: claude-sonnet-5-5
          DRIP_SWAP_LIVE: ${{ vars.DRIP_SWAP_LIVE }}
        run: |
          ARGS="--since-minutes ${{ github.event.inputs.since_minutes || '180' }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python src/sms_auto_responder.py $ARGS
      # Drip exit guard rides on this job (added 2026-10-21) so it runs every 5 minutes on the
      # dispatcher's clock; drip-exit-guard.yml keeps an hourly GitHub cron as the fallback.
      # Last since 2026-11-17: it is the slowest step, so it can no longer starve the watches.
      # It now uses the paced Sift client and --state, which skips records recently found to have
      # no running drip (10-60 min, or until their status changes).
      - name: Drip exit guard
        if: always()
        timeout-minutes: 7
        env:
          REISIFT_API_KEY: ${{ secrets.REISIFT_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DRIP_GUARD_TAGS: "Priority 1,Legacy Reopen Texts 2026-11-16,Legacy Reopen Texts 2026-11-23,Obituary P1"
          DRIP_SWAP_LIVE: ${{ vars.DRIP_SWAP_LIVE }}
        run: |
          ARGS="--state output/watch_state/drip_guard.json"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          python src/drip_exit_guard.py $ARGS
      - name: Save watch state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: output/watch_state
          key: watch-state-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responder-run-${{ github.run_id }}
          path: output/auto_responder/
          retention-days: 14
