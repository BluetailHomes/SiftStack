name: SMS auto-responder (draft mode)

# Watches DataSift for inbound texts on the Jackson P1 drip, classifies each one against
# docs/sms_reply_rules.md, and writes a suggested reply + proposed changes to the record's
# message board (and Slack). Draft mode sends NOTHING to sellers. See src/sms_auto_responder.py.
#
# TRIGGER (changed 2026-10-21): started every 5 minutes, 7:00 AM to 10:55 PM Central, by the
# Cloudflare Worker in dispatcher/ via workflow_dispatch. It has NO GitHub `schedule:` cron on
# purpose: GitHub ran the old */5 cron only 3 times in 9 hours on 2026-10-20 (a 3-hour cadence
# with a 20-minute lookback silently skipped most replies), and a second trigger could run
# concurrently with the dispatcher's and draft the same reply twice. The default lookback is
# 180 minutes so one missed poll never loses a reply; message-board markers keep it idempotent.

on:
  workflow_dispatch:
    inputs:
      since_minutes:
        description: "Lookback window in minutes"
        default: "180"
      dry_run:
        description: "true = classify only, write nothing"
        default: "false"

concurrency:
  group: sms-auto-responder
  cancel-in-progress: false

jobs:
  respond:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests anthropic python-dotenv
      - name: Run responder
        env:
          REISIFT_API_KEY: ${{ secrets.REISIFT_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          SMS_RESPONDER_MODEL: claude-sonnet-5-5
        run: |
          ARGS="--since-minutes ${{ github.event.inputs.since_minutes || '180' }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python src/sms_auto_responder.py $ARGS
      # Drip exit guard rides on this job (added 2026-10-21) so it runs every 5 minutes on the
      # dispatcher's clock instead of only on its own */15 GitHub cron, which runs hours late.
      # always(): a responder failure must not skip the guard. Idempotent, so the fallback cron
      # in drip-exit-guard.yml running too is harmless.
      - name: Drip exit guard
        if: always()
        env:
          REISIFT_API_KEY: ${{ secrets.REISIFT_API_KEY }}
          DRIP_GUARD_TAGS: "Priority 1"
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          python src/drip_exit_guard.py $ARGS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responder-run-${{ github.run_id }}
          path: output/auto_responder/
          retention-days: 14
