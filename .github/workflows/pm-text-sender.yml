name: PM Text Sender + Caller Audit

# Two scheduled jobs for the Jackson Priority 1 niche flow (see src/pm_text_sender.py):
#
#   pm-texts  4:30 PM Central, Mon-Fri. Plans (and, once enabled, sends) the
#             afternoon voicemail follow-up text to every number Rahaf left a
#             voicemail on that day. DRY RUN by default: nothing is sent until
#             the repo variable PM_TEXTS_LIVE is set to "true"
#             (Settings -> Secrets and variables -> Actions -> Variables).
#             Second step: extra-number confirmation texts (one text, ever, to
#             each mobile beyond #1/#2, from SMS Line A/B/C). Its own dry-run
#             switch: repo variable EXTRA_TEXTS_LIVE = "true".
#   audit     7:15 PM Central, Mon-Fri. Posts the end-of-day caller checklist
#             (unmarked numbers, line caps, missed callbacks, legacy tagging) to Slack.
#
# HOW THESE GET TRIGGERED (changed 2026-10-20): GitHub's own `schedule:` crons
# ran ~4 hours late on the first live day and pm-texts missed its window
# entirely, so the PRIMARY trigger for all three jobs is now the Cloudflare
# Worker in dispatcher/ (siftstack-dispatcher), which calls workflow_dispatch at
# the exact Central minute with mode=<job> and gate=true. gate=true applies the
# same --only-between window the schedule path uses, so even a queued dispatch
# can never text at dinner time.
#
# Fallbacks: am-start and audit keep their `schedule:` crons below (GitHub cron
# is UTC and has no time zone, so each has a CDT and a CST entry; the window
# gate makes the wrong one, or a late one, a no-op - both jobs are harmless to
# run twice). pm-texts has NO schedule cron and must never get one back: the
# "already texted today" check depends on DataSift logging API-sent SMS, which
# is unverified, so its only backup is the Windows task on Kaycie's machine
# ("SiftStack PM Texts", scripts/pm_texts_local.cmd) in a non-overlapping
# 17:00-17:45 Central slot.

on:
  schedule:
    - cron: '50 14 * * 1-5'   # 09:50 CDT  (am-start)
    - cron: '50 15 * * 1-5'   # 09:50 CST  (am-start)
    - cron: '15 0 * * 2-6'    # 19:15 CDT  (audit)
    - cron: '15 1 * * 2-6'    # 19:15 CST  (audit)
  workflow_dispatch:
    inputs:
      mode:
        description: Which job to run
        type: choice
        options: [pm-texts, audit, am-start]
        default: pm-texts
      day:
        description: Optional YYYY-MM-DD to backtest (always a dry run)
        required: false
      gate:
        description: Apply the job's Central time window (the Cloudflare dispatcher sets this; leave off for a manual run)
        type: boolean
        default: false

jobs:
  am-start:
    # 9:50 AM Central: sets every record in preset "01. New - Set to Prospecting"
    # to Prospecting, which fires the morning-text drip. Replaces Rahaf's 10:00
    # Select All. Dry run until the repo variable AM_START_LIVE is "true".
    if: >-
      github.event.schedule == '50 14 * * 1-5' || github.event.schedule == '50 15 * * 1-5'
      || (github.event_name == 'workflow_dispatch' && inputs.mode == 'am-start')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Overlapping starts queue instead of running side by side. The guard step then skips
    # a start after one that already finished today, carries earlier runs' state over (so
    # line caps count the whole day), and fails closed with a Slack alert when unsure.
    concurrency:
      group: pm-text-sender-am-start
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Once-per-day guard
        id: guard
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python src/workflow_run_guard.py am-start 09:40-12:00 "Start morning texts"
      - name: Start morning texts (dry run unless AM_START_LIVE is "true")
        env:
          REISIFT_API_KEY: ${{ secrets.REISIFT_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          LIVE: ${{ vars.AM_START_LIVE }}
        if: steps.guard.outputs.skip != 'true'
        run: |
          ARGS="am-start --slack"
          if [ "$LIVE" = "true" ]; then ARGS="$ARGS --send"; fi
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.gate }}" = "true" ]; then ARGS="$ARGS --only-between 09:40-12:00"; fi
          python src/pm_text_sender.py $ARGS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: am-start-${{ github.run_id }}
          path: output/pm_texts/
          if-no-files-found: ignore

  pm-texts:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'pm-texts'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Same once-per-day protection as am-start: the "already texted today" check in
    # pm_text_sender.py depends on DataSift logging API-sent texts (unverified), so a
    # second same-day run must not get as far as sending.
    concurrency:
      group: pm-text-sender-pm-texts
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Once-per-day guard
        id: guard
        if: inputs.day == ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python src/workflow_run_guard.py pm-texts 16:15-17:00 "Afternoon voicemail texts"
      - name: Afternoon voicemail texts (dry run unless PM_TEXTS_LIVE is "true")
        env:
          REISIFT_API_KEY: ${{ secrets.REISIFT_API_KEY }}
          SMRTPHONE_API_TOKEN: ${{ secrets.SMRTPHONE_API_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          LIVE: ${{ vars.PM_TEXTS_LIVE }}
          DAY: ${{ inputs.day }}
        if: steps.guard.outputs.skip != 'true'
        run: |
          ARGS="pm-texts --slack"
          if [ "$LIVE" = "true" ] && [ -z "$DAY" ]; then ARGS="$ARGS --send"; fi
          if [ -n "$DAY" ]; then ARGS="$ARGS --day $DAY"; fi
          if [ "${{ inputs.gate }}" = "true" ]; then ARGS="$ARGS --only-between 16:15-17:00"; fi
          echo "python src/pm_text_sender.py $ARGS"
          python src/pm_text_sender.py $ARGS
      - name: Extra-number confirmation texts (dry run unless EXTRA_TEXTS_LIVE is "true")
        env:
          REISIFT_API_KEY: ${{ secrets.REISIFT_API_KEY }}
          SMRTPHONE_API_TOKEN: ${{ secrets.SMRTPHONE_API_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          LIVE: ${{ vars.EXTRA_TEXTS_LIVE }}
        if: always() && steps.guard.outputs.skip != 'true' && inputs.day == ''
        run: |
          ARGS="extra-texts --slack"
          if [ "$LIVE" = "true" ]; then ARGS="$ARGS --send"; fi
          if [ "${{ inputs.gate }}" = "true" ]; then ARGS="$ARGS --only-between 16:15-17:00"; fi
          echo "python src/pm_text_sender.py $ARGS"
          python src/pm_text_sender.py $ARGS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pm-texts-${{ github.run_id }}
          path: output/pm_texts/
          if-no-files-found: ignore

  audit:
    if: >-
      github.event.schedule == '15 0 * * 2-6' || github.event.schedule == '15 1 * * 2-6'
      || (github.event_name == 'workflow_dispatch' && inputs.mode == 'audit')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: End-of-day caller audit
        env:
          REISIFT_API_KEY: ${{ secrets.REISIFT_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DAY: ${{ inputs.day }}
        run: |
          ARGS="audit --slack"
          if [ -n "$DAY" ]; then ARGS="$ARGS --day $DAY"; fi
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.gate }}" = "true" ]; then ARGS="$ARGS --only-between 19:00-20:00"; fi
          python src/pm_text_sender.py $ARGS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-${{ github.run_id }}
          path: output/pm_texts/
          if-no-files-found: ignore
